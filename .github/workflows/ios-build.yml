
name: RUSH AdBlock - iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Find Xcode projects
        run: |
          find . \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print
